# EZTest results server + PostgreSQL + a test runner that publishes to it.
#
#   cp deploy/.env.example deploy/.env      # set the passwords and tokens
#   docker compose -f deploy/docker-compose.yml up -d postgres server
#   docker compose -f deploy/docker-compose.yml run --rm runner              # runs ./journeys, publishes the run
#   open http://localhost:8080/ui
#
# Put TLS in front of the server (a reverse proxy) for anything beyond a laptop: see docs/server.md.
name: eztest

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eztest
      POSTGRES_USER: eztest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eztest -d eztest"]
      interval: 5s
      retries: 20

  server:
    image: ${EZTEST_IMAGE:-eztest:latest}
    build: ..
    command: ["server", "--host", "0.0.0.0", "--port", "8080", "--data-dir", "/data"]
    environment:
      EZTEST_SERVER_DATABASE_URL: postgres://eztest:${POSTGRES_PASSWORD}@postgres:5432/eztest
      # Lets the first admin create real tokens (eztest server token create, or POST /api/tokens). Rotate after setup.
      EZTEST_SERVER_BOOTSTRAP_TOKEN: ${EZTEST_SERVER_BOOTSTRAP_TOKEN:?set EZTEST_SERVER_BOOTSTRAP_TOKEN in deploy/.env}
      # Behind a TLS proxy, set the external URL (OIDC redirect URI, secure cookies).
      EZTEST_SERVER_PUBLIC_URL: ${EZTEST_SERVER_PUBLIC_URL:-}
    volumes:
      - serverdata:/data
    ports:
      - "${EZTEST_SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10

  runner:
    image: ${EZTEST_IMAGE:-eztest:latest}
    profiles: ["run"]
    # Reach an app running on the Docker host as http://host.docker.internal:<port>.
    extra_hosts: ["host.docker.internal:host-gateway"]
    working_dir: /work
    volumes:
      - ${EZTEST_PROJECT_DIR:-..}:/work
    environment:
      EZTEST_SERVER_TOKEN: ${EZTEST_SERVER_TOKEN:-}
    command: ["run", "--publish", "http://server:8080", "--reporter", "html,json,junit"]
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
  serverdata:
